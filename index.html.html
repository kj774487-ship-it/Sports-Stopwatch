<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrono Sports Stopwatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-hud {
      font-family: 'Teko', sans-serif;
      letter-spacing: 0.08em;
    }
    .font-digital {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Stadium Ambient Background with dynamic Olympic track lighting */
    .stadium-bg {
      background: linear-gradient(180deg, rgba(7, 18, 33, 0.72) 0%, rgba(10, 25, 47, 0.45) 50%, rgba(5, 12, 22, 0.85) 100%),
                  url('https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat;
    }

    /* Top Header Angled HUD Polygon */
    .hud-title-banner {
      clip-path: polygon(14% 0%, 86% 0%, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, rgba(23, 44, 71, 0.95) 0%, rgba(13, 27, 46, 0.98) 100%);
      border-top: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Main Beveled Stopwatch Device Housing */
    .chrono-body {
      background: radial-gradient(circle at 35% 25%, #3e5a77 0%, #293d53 45%, #19293b 90%);
      border: 2px solid #58799a;
      box-shadow: 
        0 25px 60px -10px rgba(0, 0, 0, 0.85),
        inset 2px 2px 4px rgba(255, 255, 255, 0.35),
        inset -3px -3px 6px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      position: relative;
    }

    /* Recessed LCD/LED Bezel */
    .screen-housing {
      background: linear-gradient(180deg, #0b1520 0%, #060b12 100%);
      border: 3px solid #142130;
      box-shadow: 
        inset 0 4px 10px rgba(0, 0, 0, 0.9),
        inset 0 0 20px rgba(0, 0, 0, 0.8),
        0 1px 1px rgba(255, 255, 255, 0.15);
    }

    /* Digital LED Glow for Cyan Stopwatch digits */
    .digital-glow-cyan {
      color: #67e8f9;
      text-shadow: 
        0 0 10px rgba(103, 232, 249, 0.7),
        0 0 25px rgba(6, 182, 212, 0.45);
    }
    .digital-glow-white {
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.75),
        0 0 20px rgba(103, 232, 249, 0.4);
    }

    /* Sports Speed Neon Streaks */
    .speed-streak-1 {
      position: absolute;
      top: -30px;
      right: -45px;
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0) 0%, rgba(56, 189, 248, 0.9) 50%, rgba(255, 255, 255, 1) 100%);
      transform: rotate(-35deg);
      filter: drop-shadow(0 0 8px #38bdf8);
      pointer-events: none;
    }
    .speed-streak-2 {
      position: absolute;
      bottom: -25px;
      left: -35px;
      width: 160px;
      height: 2.5px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 1) 0%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0) 100%);
      transform: rotate(-40deg);
      filter: drop-shadow(0 0 8px #38bdf8);
      pointer-events: none;
    }

    /* 3D Tactile Buttons replicating the exact physical button look */
    .btn-3d-green {
      background: linear-gradient(180deg, #6bb849 0%, #4e9c2c 60%, #3a7a1f 100%);
      border: 1px solid #84d85e;
      box-shadow: 
        0 6px 0 #235212,
        0 9px 15px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .btn-3d-green:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #235212,
        0 4px 8px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-3d-red {
      background: linear-gradient(180deg, #d94b46 0%, #b8322e 60%, #8e201c 100%);
      border: 1px solid #ff736e;
      box-shadow: 
        0 6px 0 #5c110f,
        0 9px 15px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .btn-3d-red:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #5c110f,
        0 4px 8px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-3d-yellow {
      background: linear-gradient(180deg, #dfb943 0%, #c49d27 60%, #997816 100%);
      border: 1px solid #fae27a;
      box-shadow: 
        0 6px 0 #614907,
        0 9px 15px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .btn-3d-yellow:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #614907,
        0 4px 8px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* Right LAPS HUD Window */
    .laps-hud-card {
      background: linear-gradient(180deg, rgba(17, 34, 53, 0.88) 0%, rgba(9, 20, 33, 0.94) 100%);
      border: 2px solid #2f5070;
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.75),
        inset 1px 1px 2px rgba(255, 255, 255, 0.15),
        0 0 15px rgba(34, 211, 238, 0.12);
      backdrop-filter: blur(8px);
    }

    /* Custom Scrollbar for HUD laps */
    .laps-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .laps-scroll::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 4px;
    }
    .laps-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body class="stadium-bg min-h-screen flex flex-col items-center justify-between text-white relative overflow-x-hidden selection:bg-cyan-500 selection:text-black">

  <header class="w-full max-w-5xl pt-4 px-4 flex items-center justify-between z-20">
    <!-- Top Left HUD Links -->
    <nav class="flex items-center gap-6 sm:gap-10 text-xs sm:text-sm font-bold tracking-widest text-slate-300">
      <button class="relative py-1 text-cyan-400 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-cyan-400">
        TIMER
      </button>
      <button onclick="toggleModal('historyModal')" class="hover:text-cyan-300 transition-colors">
        HISTORY
      </button>
      <button onclick="toggleModal('settingsModal')" class="hover:text-cyan-300 transition-colors">
        SETTINGS
      </button>
    </nav>

    <!-- Center Trapezoid Banner: CHRONO SPORTS STOPWATCH -->
    <div class="hud-title-banner px-8 py-1.5 sm:px-14 sm:py-2 text-center rounded-b-md shadow-2xl">
      <span class="font-hud text-lg sm:text-2xl text-slate-200 uppercase tracking-widest font-semibold flex items-center gap-2 justify-center">
        <span class="text-white">CHRONO</span>
        <span class="text-slate-300 font-normal">SPORTS STOPWATCH</span>
      </span>
    </div>

    <!-- Status indicator badge -->
    <div class="hidden sm:flex items-center gap-2 bg-slate-900/80 px-3 py-1 rounded border border-slate-700 text-xs tracking-wider">
      <span id="liveStatusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="liveStatusText" class="text-emerald-300 uppercase font-semibold">READY</span>
    </div>
  </header>

  <main class="w-full max-w-5xl my-auto px-4 py-8 flex flex-col lg:flex-row items-center justify-center gap-8 z-10">

    <!-- Central Sports Timer Console -->
    <div class="relative w-full max-w-md">
      <!-- Dynamic Speed Neon Flare Lines -->
      <div class="speed-streak-1"></div>
      <div class="speed-streak-2"></div>

      <div class="chrono-body rounded-2xl p-5 sm:p-6">
        
        <!-- Top Running Icon & Chamfer accent -->
        <div class="flex items-center justify-between mb-3 text-slate-400">
          <div class="w-8 h-8 rounded-lg bg-slate-800/80 border border-slate-600/70 flex items-center justify-center text-cyan-400 shadow-inner">
            <!-- Runner Icon -->
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>
            </svg>
          </div>
          <div class="flex items-center gap-2 text-[10px] tracking-widest uppercase font-bold text-slate-300 bg-slate-900/60 px-2.5 py-0.5 rounded border border-slate-700">
            PRO ACCURACY • 1/100s
          </div>
        </div>

        <!-- LCD Screen Area -->
        <div class="screen-housing rounded-xl px-4 py-6 sm:px-6 sm:py-7 relative mb-6">
          <!-- Column Labels MIN / SEC / MS -->
          <div class="flex justify-between text-xs tracking-widest uppercase font-bold text-cyan-400/90 px-2 sm:px-4 mb-1">
            <span class="w-20 text-center">MIN</span>
            <span class="w-20 text-center">SEC</span>
            <span class="w-16 text-right">MS</span>
          </div>

          <!-- Numbers Display -->
          <div class="font-digital flex items-baseline justify-between select-none">
            <!-- Minutes -->
            <span id="minutesDisplay" class="text-4xl sm:text-5xl font-bold digital-glow-white tracking-tighter w-20 text-center">00</span>
            <span class="text-3xl sm:text-4xl font-bold text-cyan-400/80 -mt-1">:</span>
            <!-- Seconds -->
            <span id="secondsDisplay" class="text-4xl sm:text-5xl font-bold digital-glow-white tracking-tighter w-20 text-center">00</span>
            <span class="text-2xl sm:text-3xl font-bold text-cyan-400 -mt-1">.</span>
            <!-- Milliseconds -->
            <span id="millisDisplay" class="text-3xl sm:text-4xl font-bold digital-glow-cyan tracking-tight w-16 text-right">00</span>
          </div>
        </div>

        <!-- Right edge sports icons tab (Cycling helmet + Swim goggles) -->
        <div class="absolute -right-4 top-1/2 -translate-y-1/2 hidden sm:flex flex-col gap-3 py-2 px-1 bg-[#1a2c3f] border border-[#405f7e] rounded-r-lg shadow-lg text-slate-400">
          <!-- Helmet Icon -->
          <span title="Cycling / Track" class="hover:text-cyan-400 cursor-pointer">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.22.73 4.27 1.96 5.93L12 22l8.04-4.07C21.27 16.27 22 14.22 22 12c0-5.52-4.48-10-10-10zm-1 15H9v-2h2v2zm4 0h-2v-2h2v2zm2-5H7V9h10v3z"/></svg>
          </span>
          <!-- Goggles Icon -->
          <span title="Swimming / Aquatics" class="hover:text-cyan-400 cursor-pointer">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
          </span>
        </div>

        <!-- 3 Heavy Duty Tactile Push Buttons -->
        <div class="grid grid-cols-3 gap-3 sm:gap-4 pt-1">
          <!-- START Button (Green) -->
          <button id="btnStart" class="btn-3d-green py-3.5 sm:py-4 px-2 rounded-xl flex flex-col items-center justify-center transition-all">
            <div id="startIcon" class="w-0 h-0 border-y-[8px] border-y-transparent border-l-[14px] border-l-white ml-1 mb-1 filter drop-shadow"></div>
            <span id="startText" class="font-hud text-lg sm:text-xl font-bold tracking-wider text-white uppercase drop-shadow">START</span>
          </button>

          <!-- STOP Button (Red) -->
          <button id="btnStop" class="btn-3d-red py-3.5 sm:py-4 px-2 rounded-xl flex flex-col items-center justify-center transition-all opacity-80 cursor-pointer">
            <div class="w-3.5 h-3.5 bg-white rounded-xs mb-1.5 shadow-sm"></div>
            <span class="font-hud text-lg sm:text-xl font-bold tracking-wider text-white uppercase drop-shadow">STOP</span>
          </button>

          <!-- LAP / RESET Button (Yellow) -->
          <button id="btnLapReset" class="btn-3d-yellow py-3.5 sm:py-4 px-1 rounded-xl flex flex-col items-center justify-center transition-all">
            <span id="lapResetTopText" class="font-hud text-base sm:text-lg font-bold leading-tight tracking-wider text-slate-900 uppercase">LAP /</span>
            <span id="lapResetBottomText" class="font-hud text-base sm:text-lg font-bold leading-tight tracking-wider text-slate-900 uppercase">RESET</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Floating LAPS HUD Window (As seen in the screenshot) -->
    <div class="w-full max-w-xs sm:w-80 laps-hud-card rounded-2xl p-5 flex flex-col self-stretch justify-between">
      <div>
        <div class="flex items-center justify-between border-b border-cyan-800/50 pb-3 mb-3">
          <h2 class="font-hud text-2xl text-white tracking-widest uppercase">LAPS</h2>
          <span id="lapBadgeCounter" class="text-xs font-digital text-cyan-400 bg-cyan-950/80 px-2 py-0.5 rounded border border-cyan-700/60">
            TOTAL: 0
          </span>
        </div>

        <!-- Laps list entries -->
        <div id="lapsList" class="laps-scroll max-h-56 overflow-y-auto space-y-2 text-sm sm:text-base font-digital">
          <div class="text-slate-400 text-xs italic py-4 text-center">Press "LAP" while running to log split timings</div>
        </div>
      </div>

      <!-- Quick Export / Clear HUD bar -->
      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
        <button id="btnExport" class="hover:text-cyan-300 transition-colors uppercase tracking-wider font-semibold">Copy Times</button>
        <button id="btnClearLaps" class="hover:text-rose-400 transition-colors uppercase tracking-wider">Clear Laps</button>
      </div>
    </div>

  </main>

  <footer class="w-full max-w-5xl pb-4 px-4 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-300 z-10">
    <div class="flex items-center gap-4 bg-slate-950/70 px-4 py-2 rounded-lg border border-slate-800 backdrop-blur">
      <span class="flex items-center gap-1.5"><kbd class="bg-slate-800 text-cyan-400 px-1.5 py-0.5 rounded text-[11px] font-mono">SPACE</kbd> Start / Stop</span>
      <span class="flex items-center gap-1.5"><kbd class="bg-slate-800 text-cyan-400 px-1.5 py-0.5 rounded text-[11px] font-mono">L</kbd> Lap</span>
      <span class="flex items-center gap-1.5"><kbd class="bg-slate-800 text-cyan-400 px-1.5 py-0.5 rounded text-[11px] font-mono">R</kbd> Reset</span>
    </div>

    <div class="text-[11px] text-slate-400 tracking-wider">
      STADIUM EDITION v2.4 • OLYMPIC ACCURACY
    </div>
  </footer>

  <!-- Modal for HISTORY / SETTINGS -->
  <div id="infoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="laps-hud-card max-w-md w-full p-6 rounded-2xl border border-cyan-500/40">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitle" class="font-hud text-2xl text-cyan-300 tracking-wider uppercase">MODAL</h3>
        <button onclick="toggleModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      <div id="modalContent" class="text-slate-300 text-sm leading-relaxed mb-6"></div>
      <button onclick="toggleModal()" class="w-full py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 font-bold uppercase tracking-wider text-black">Close</button>
    </div>
  </div>

  <script>
    // State Variables
    let isRunning = false;
    let startTime = 0;
    let elapsedTime = 0;
    let animationFrameId = null;
    let laps = [];
    let lastLapEndTime = 0;

    // DOM References
    const minutesDisplay = document.getElementById('minutesDisplay');
    const secondsDisplay = document.getElementById('secondsDisplay');
    const millisDisplay = document.getElementById('millisDisplay');
    const lapsList = document.getElementById('lapsList');
    const lapBadgeCounter = document.getElementById('lapBadgeCounter');
    const liveStatusDot = document.getElementById('liveStatusDot');
    const liveStatusText = document.getElementById('liveStatusText');

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnLapReset = document.getElementById('btnLapReset');
    const startText = document.getElementById('startText');
    const startIcon = document.getElementById('startIcon');
    const btnExport = document.getElementById('btnExport');
    const btnClearLaps = document.getElementById('btnClearLaps');

    // Web Audio Synthesizer for realistic tactical stopwatch beep sounds
    const playChronoSound = (freq = 600, type = 'sine', duration = 0.05) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (err) {
        // Audio policy fallback
      }
    };

    // Time formatting helper
    function getFormattedTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const centiseconds = Math.floor((ms % 1000) / 10);

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      const cs = String(centiseconds).padStart(2, '0');

      return { mm, ss, cs, string: `${mm}:${ss}.${cs}` };
    }

    // High performance animation loop
    function updateTimer() {
      if (!isRunning) return;
      elapsedTime = performance.now() - startTime;
      
      const t = getFormattedTime(elapsedTime);
      minutesDisplay.textContent = t.mm;
      secondsDisplay.textContent = t.ss;
      millisDisplay.textContent = t.cs;

      animationFrameId = requestAnimationFrame(updateTimer);
    }

    // START / RESUME Handler
    function handleStart() {
      if (isRunning) return;
      isRunning = true;
      startTime = performance.now() - elapsedTime;
      animationFrameId = requestAnimationFrame(updateTimer);

      // UI Updates
      startText.textContent = 'RUN';
      startIcon.className = 'w-2.5 h-2.5 bg-white rounded-full mb-1 animate-ping';
      liveStatusDot.className = 'w-2 h-2 rounded-full bg-cyan-400 animate-ping';
      liveStatusText.className = 'text-cyan-300 uppercase font-semibold';
      liveStatusText.textContent = 'TIMING';

      btnStop.classList.remove('opacity-80');
      playChronoSound(880, 'sine', 0.08); // High pitched sports start beep
    }

    // STOP / PAUSE Handler
    function handleStop() {
      if (!isRunning && elapsedTime === 0) return;
      if (isRunning) {
        isRunning = false;
        cancelAnimationFrame(animationFrameId);

        startText.textContent = 'RESUME';
        startIcon.className = 'w-0 h-0 border-y-[8px] border-y-transparent border-l-[14px] border-l-white ml-1 mb-1 filter drop-shadow';
        liveStatusDot.className = 'w-2 h-2 rounded-full bg-amber-400';
        liveStatusText.className = 'text-amber-300 uppercase font-semibold';
        liveStatusText.textContent = 'STOPPED';

        playChronoSound(440, 'triangle', 0.1);
      }
    }

    // LAP / RESET Handler
    function handleLapReset() {
      if (isRunning) {
        // Record Lap
        const currentLapTotal = elapsedTime;
        const lapDuration = currentLapTotal - lastLapEndTime;
        lastLapEndTime = currentLapTotal;

        laps.push({
          lapNumber: laps.length + 1,
          lapTime: lapDuration,
          totalTime: currentLapTotal
        });

        renderLaps();
        playChronoSound(1200, 'sine', 0.04);
      } else {
        // Reset when stopped
        handleReset();
      }
    }

    // Complete Reset
    function handleReset() {
      isRunning = false;
      cancelAnimationFrame(animationFrameId);
      elapsedTime = 0;
      lastLapEndTime = 0;
      
      minutesDisplay.textContent = '00';
      secondsDisplay.textContent = '00';
      millisDisplay.textContent = '00';

      startText.textContent = 'START';
      startIcon.className = 'w-0 h-0 border-y-[8px] border-y-transparent border-l-[14px] border-l-white ml-1 mb-1 filter drop-shadow';
      liveStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
      liveStatusText.className = 'text-emerald-300 uppercase font-semibold';
      liveStatusText.textContent = 'READY';

      btnStop.classList.add('opacity-80');
      playChronoSound(300, 'sawtooth', 0.07);
    }

    // Render Laps accurately styled as in the image
    function renderLaps() {
      if (laps.length === 0) {
        lapsList.innerHTML = `<div class="text-slate-400 text-xs italic py-4 text-center">Press "LAP" while running to log split timings</div>`;
        lapBadgeCounter.textContent = 'TOTAL: 0';
        return;
      }

      lapBadgeCounter.textContent = `TOTAL: ${laps.length}`;

      // Find fastest lap to highlight in gold/yellow just like LAP 3 in the reference image
      let fastestLapIndex = -1;
      if (laps.length > 1) {
        let minTime = Infinity;
        laps.forEach((l, idx) => {
          if (l.lapTime < minTime) {
            minTime = l.lapTime;
            fastestLapIndex = idx;
          }
        });
      }

      lapsList.innerHTML = laps.map((lap, index) => {
        const formatted = getFormattedTime(lap.lapTime);
        const isFastest = index === fastestLapIndex;
        const colorClass = isFastest ? 'text-amber-300 font-bold' : 'text-cyan-400';
        
        return `
          <div class="flex items-center justify-between py-1.5 px-2.5 rounded bg-slate-900/60 border border-slate-800/80">
            <span class="text-slate-300 tracking-wider font-semibold">LAP ${lap.lapNumber}:</span>
            <span class="${colorClass} tracking-wider">00:${formatted.mm}:${formatted.ss}.${formatted.cs}</span>
          </div>
        `;
      }).reverse().join('');
    }

    // Clipboard Copy for times
    btnExport.addEventListener('click', () => {
      if (laps.length === 0 && elapsedTime === 0) return;
      const formattedTotal = getFormattedTime(elapsedTime).string;
      let text = `CHRONO SPORTS STOPWATCH REPORT\nTotal Time: ${formattedTotal}\n\n`;
      laps.forEach(l => {
        text += `LAP ${l.lapNumber}: ${getFormattedTime(l.lapTime).string} (Split at ${getFormattedTime(l.totalTime).string})\n`;
      });

      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);

      const original = btnExport.textContent;
      btnExport.textContent = 'COPIED!';
      setTimeout(() => btnExport.textContent = original, 1600);
    });

    // Clear Laps button
    btnClearLaps.addEventListener('click', () => {
      laps = [];
      lastLapEndTime = isRunning ? elapsedTime : 0;
      renderLaps();
    });

    // Event Bindings
    btnStart.addEventListener('click', handleStart);
    btnStop.addEventListener('click', handleStop);
    btnLapReset.addEventListener('click', handleLapReset);

    // Keyboard Shortcuts (Space, L, R)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (isRunning) handleStop();
        else handleStart();
      } else if (e.key.toLowerCase() === 'l') {
        e.preventDefault();
        if (isRunning) handleLapReset();
      } else if (e.key.toLowerCase() === 'r') {
        e.preventDefault();
        handleReset();
      }
    });

    // Modal popup utility for History and Settings tabs
    window.toggleModal = function(type) {
      const modal = document.getElementById('infoModal');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');

      if (!type) {
        modal.classList.add('hidden');
        return;
      }

      if (type === 'historyModal') {
        title.textContent = 'SESSION HISTORY';
        content.innerHTML = laps.length > 0 
          ? `<p class="mb-2">Total session time: <strong>${getFormattedTime(elapsedTime).string}</strong></p><p>Total recorded laps: <strong>${laps.length} laps</strong></p>`
          : 'No previous sessions saved yet. Run the stopwatch to generate session records.';
      } else if (type === 'settingsModal') {
        title.textContent = 'SETTINGS & CALIBRATION';
        content.innerHTML = `
          <ul class="space-y-2">
            <li>Precision: <strong>1/100th Second (10ms)</strong></li>
            <li>Sound Effects: <strong>Web Audio Synthesizer ON</strong></li>
            <li>High Contrast Stadium HUD: <strong>ENABLED</strong></li>
          </ul>
        `;
      }
      modal.classList.remove('hidden');
    };
  </script>
</body>
</html>
